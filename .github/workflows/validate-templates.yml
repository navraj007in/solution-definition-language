name: Validate SDL Templates

on:
  push:
    paths:
      - 'templates/**'
      - 'examples/**'
      - 'schema/**'
      - 'packages/sdl/**'
      - 'spec/**'
      - 'reference/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/validate-templates.yml'
  pull_request:
    paths:
      - 'templates/**'
      - 'examples/**'
      - 'schema/**'
      - 'packages/sdl/**'
      - 'spec/**'
      - 'reference/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/validate-templates.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: packages/sdl
        run: npm ci --no-audit --no-fund

      # Non-mutating: `npm run sync:schema` (run later, inside `build`)
      # regenerates the mirror, so checking it *after* build would hide
      # exactly the drift this step exists to catch.
      - name: Verify schema mirror is in sync
        working-directory: packages/sdl
        run: npm run check:schema-mirror

      - name: Build SDL package
        working-directory: packages/sdl
        run: npm run build

      - name: Run tests
        working-directory: packages/sdl
        run: npm test

      # Packs the tarball exactly as it would be published and verifies it
      # loads under both require() and native Node ESM import — npm test
      # above only exercises the CJS build via node --test.
      - name: Verify packed package (CJS + native ESM)
        working-directory: packages/sdl
        run: npm run test:packed

      # Corpus validation lives in packages/sdl/src/__tests__/examples.test.ts,
      # which `npm test` above already runs. It globs templates/, every
      # single-file example, both multi-file roots, and the conformance corpus,
      # and it goes through compile() — so schema AND semantic (SEM-*) rules
      # both run.
      #
      # This step used to re-implement a weaker version of that inline: it
      # looped over templates/*.sdl.yaml only (never examples/, despite this
      # workflow triggering on examples/**) and called validate() without
      # validateSemantics(). Keeping a second, weaker copy of the check here
      # just gives it somewhere to drift.
      - name: Confirm corpus coverage
        run: |
          echo "SDL corpus is validated by examples.test.ts in the test step above."
          echo "Templates:      $(ls templates/*.sdl.yaml | wc -l)"
          echo "Examples:       $(ls examples/single-file/*.yaml | wc -l)"
          echo "Conformance:    $(ls examples/conformance/valid/*.yaml examples/conformance/invalid/*.yaml | wc -l)"
