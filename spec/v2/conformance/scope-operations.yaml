    rules:
      - SO-001
    value:
      data:
        primaryDatabase:
          id: main
          type: postgres
          hosting: managed
        databaseMode: none
      deployment:
        targets:
          - name: east
            cloud: aws
            region: us-east-1
          - name: west
            cloud: aws
            region: us-west-2
        environments:
          - name: prod
            projects: []
            services: []
            placements: []
            dataInstances:
              - name: db
                resource: database/main
                target: east
                role: primary
    expected:
      outcome: reject
      violations:
        - SO-001
