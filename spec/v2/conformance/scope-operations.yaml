format: sdl-conformance-cases/v1
target: sdl-v2-scope-operations
cases:
  - id: scope-database-none
    scope: scope-operations
    rules:
      - SO-001
    value:
      data:
        databaseMode: none
    expected:
      outcome: accept
      meaning:
        databases: 0
        statelessnessVerified: false
  - id: scope-empty-data-unknown
    scope: scope-operations
    rules:
      - SO-001
    value:
      data: {}
    expected:
      outcome: accept
      meaning:
        databaseCompleteness: unspecified
