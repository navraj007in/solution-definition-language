    value:
      sdlVersion: "2.0"
      solution:
        teams:
          - name: platform
      architecture:
        projects:
          backend:
            - name: status-api
              framework: nodejs
              language: typescript
              path: apps/status
              owner: platform
        errorConventions:
          envelope:
            kind: object
            codeField: error.code
            fields:
              - name: error
                type: object
                required: true
              - name: error.code
                type: string
                required: true
              - name: error.message
                type: string
                required: true
              - name: error.detail
                type: object
              - name: error.detail.requestId
                type: string
                required: true
          status_mapping:
            - status: 503
              code: SERVICE_UNAVAILABLE
              retryable: true
              retry_after_header: true
          retry_policy:
            max_attempts: 4
            backoff: exponential
            base_ms: 200
            cap_ms: 500
      contracts:
        apis:
          - name: Status API
            type: rest
            owner: platform
            component: status-api
            errorConventions: standard
            spec:
              path: contracts/status.openapi.yaml
              format: openapi
              version: 3.1.1
      resilience:
        retryPolicy:
          maxAttempts: 3
          backoff: fixed
          initialInterval: 300ms
        timeout:
          default: 2s
    sourceFile: ../examples/contracts-errors.sdl.yaml
    resources:
      contracts/status.openapi.yaml: |
        openapi: "3.1.1"
        info:
          title: Status API
          version: "1.0.0"
        paths:
          /status:
            get:
              operationId: getStatus
              responses:
                "200":
                  description: Service is available.
                "503":
                  description: A transient service failure; follows the SDL standard error convention.
                  headers:
                    Retry-After:
                      description: Required by this API's SDL convention; delay-seconds or HTTP-date.
                      schema:
                        type: string
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/UnavailableError"
        components:
          schemas:
            UnavailableError:
              type: object
              required: [error]
              properties:
                error:
                  type: object
                  required: [code, message]
                  properties:
                    code:
                      type: string
                      const: SERVICE_UNAVAILABLE
                    message:
                      type: string
                    detail:
                      type: object
                      required: [requestId]
                      properties:
                        requestId:
                          type: string
    resourceFiles:
      contracts/status.openapi.yaml: ../examples/contracts/status.openapi.yaml
    observation:
      api: Status API
      status: 503
      code: SERVICE_UNAVAILABLE
      failedExecution: 1
      replaySafe: true
      retryAfter:
        - "2"
    expected:
      outcome: accept
      meaning:
        target: contracts/status.openapi.yaml
        retry: true
        maxExecutions: 3
        minimumDelayMs: 2000
        producerConventionViolation: false
