format: sdl-conformance-cases/v1
target: sdl-v2-contracts
cases:
  - id: contract-local-openapi
    scope: contracts
    rules:
      - EC-001
      - EC-002
      - EC-003
    value:
      contracts:
        apis:
          - name: API
            type: rest
            spec:
              path: contracts/api.yaml
              format: openapi
              version: 3.1.1
    resources:
      contracts/api.yaml: |
        openapi: 3.1.1
        info:
          title: Example
          version: "7.0"
        paths: {}
    expected:
      outcome: accept
      meaning:
        target: contracts/api.yaml
        pointer: ""
        externalFormatValidated: false
  - id: contract-inventory-without-reference
    scope: contracts
    rules:
      - EC-001
    value:
      contracts:
        apis:
          - name: API
    expected:
      outcome: accept
      meaning:
        externalReference: null
