  - id: contract-standard-managed-project
    scope: contracts
    rules:
      - EC-004
    value:
      architecture:
        projects:
          backend:
            - name: api
              framework: nodejs
        errorConventions:
          envelope:
            kind: object
            fields:
              - name: error
                type: object
                required: true
              - name: error.code
                type: string
                required: true
              - name: error.message
                type: string
                required: true
            codeField: error.code
          status_mapping:
            - status: 503
              code: UNAVAILABLE
              retryable: true
          retry_policy:
            max_attempts: 4
            backoff: exponential
            base_ms: 200
            cap_ms: 500
      contracts:
        apis:
          - name: API
            type: rest
            component: api
            errorConventions: standard
      resilience:
        retryPolicy:
          maxAttempts: 3
