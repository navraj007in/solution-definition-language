sdlVersion: "1.1"
solution:
  name: "Billing API"
  description: "Subscription billing with typed endpoints driving codegen"
  stage: MVP

architecture:
  style: modular-monolith
  projects:
    backend:
      - name: api
        framework: nodejs
  services:
    - name: billing
      kind: backend
      endpoints:
        - id: list-charges
          path: /v1/charges
          method: GET
          summary: List charges
          auth: required
          query:
            - name: limit
              type: integer
              required: false
              min: 1
              max: 100
              default: 50
            - name: status
              type: string
              values: [pending, paid, failed]
          response:
            status: 200
            body:
              kind: object
              fields:
                - name: items
                  type: 'array<ref:Charge>'
                  required: true
                - name: cursor
                  type: string

        - id: create-charge
          path: /v1/charges
          method: POST
          auth:
            required: true
            scopes_all: [charges:write]
          request:
            body:
              kind: object
              fields:
                - name: amountCents
                  type: integer
                  required: true
                  min: 1
                - name: currency
                  type: string
                  required: true
                  minLength: 3
                  maxLength: 3
                - name: customerId
                  type: uuid
                  required: true
          response:
            status: 201
            body:
              kind: ref
              ref: Charge
          errors:
            - status: 400
              code: VALIDATION
              retryable: false
            - status: 402
              code: PAYMENT_FAILED
              retryable: true

        - id: get-charge
          path: /v1/charges/{id}
          method: GET
          auth: required
          path_params:
            - name: id
              type: uuid
              required: true
          response:
            status: 200
            body:
              kind: ref
              ref: Charge
          errors:
            - status: 404
              code: NOT_FOUND
              retryable: false

data:
  primaryDatabase:
    type: postgres
    hosting: managed
